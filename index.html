<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Player v1.0.3</title>
    <meta name="color-scheme" content="light dark">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     <div class="dropzone" id="dropzone"></div>
     <div class="boxmediacontainer" id="boxmediacontainer"></div>
     <div class="presentation" id="presentation">

         <p style="font-size: 4vh;">Bienvenido a Grid Player v1.0.3</p>
         <br/>
         <br/>
         <p style="font-size: 3vh;">Presiona la tecla "i" para editar las extensiones de imágenes.</p>
         <p style="font-size: 3vh;">Presiona la tecla "v" para editar las extensiones de video.</p>
         <p style="font-size: 3vh;">Presiona la tecla "c" mientras dibujas para que se forme un círculo.</p>

     </div>
     <script src="index.js"></script>
</body>
</html>
